<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual Admin | Flow Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-deep: #0a0b0d;
            --bg-card: #14161a;
            --accent: #00ff88;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: rgba(20, 22, 26, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar { width: 350px; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .trace-item:hover { background: rgba(0, 255, 136, 0.05); }
        .trace-active { border-right: 3px solid var(--accent); background: rgba(0, 255, 136, 0.1); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar: Trace History -->
    <div class="sidebar flex flex-col glass overflow-y-auto">
        <div class="p-6 border-b border-white/10">
            <h1 class="text-xl font-extrabold tracking-tighter text-white flex items-center gap-2">
                <span class="text-emerald-400">QUAL</span> ADMIN
                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded uppercase tracking-widest">v4.1</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-widest font-semibold flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full pulse"></span> Live System Monitoring
            </p>
        </div>

        <div id="traceList" class="flex-1 overflow-y-auto">
            <!-- Traces injected here -->
            <div class="p-10 text-center text-slate-500 text-sm">
                No active traces recorded.
            </div>
        </div>
    </div>

    <!-- Main Content: Flow Visualization -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- Header: Health Metrics -->
        <div class="h-20 glass border-b border-white/10 flex items-center justify-between px-8 shrink-0">
            <div class="flex gap-8">
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block">Status</span>
                    <span class="text-emerald-400 font-bold flex items-center gap-2" id="sysStatus">--</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block">Latency (P50)</span>
                    <span class="text-white font-bold" id="p50Latency">--ms</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block">Success Rate</span>
                    <span class="text-white font-bold" id="successRate">--%</span>
                </div>
            </div>
            <button onclick="refreshData()" class="p-2 hover:bg-white/5 rounded transition-all">
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            </button>
        </div>

        <!-- Flow Visualization Area -->
        <div class="flex-1 overflow-y-auto p-8" id="flowArea">
            <div class="h-full flex flex-col items-center justify-center text-slate-500">
                <svg class="w-16 h-16 opacity-20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
                <p>Select a query trace to visualize the full agentic flow.</p>
            </div>
        </div>

    </div>

    <!-- Modals / Overlays -->
    <div id="loader" class="absolute inset-0 bg-black/50 z-50 hidden flex items-center justify-center pointer-events-none">
        <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <script>
        let allHistory = [];
        let currentTraceId = null;

        async function refreshData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const [historyRes, healthRes] = await Promise.all([
                    fetch('/api/admin/traces'),
                    fetch('/api/admin/health')
                ]);
                
                allHistory = await historyRes.json();
                const health = await healthRes.json();
                
                renderHistory();
                updateHealth(health);
            } catch (err) {
                console.error("Dashboard failed to sync:", err);
            }
            document.getElementById('loader').classList.add('hidden');
        }

        function renderHistory() {
            const list = document.getElementById('traceList');
            if (allHistory.length === 0) {
                list.innerHTML = '<div class="p-10 text-center text-slate-500 text-sm">No traces found.</div>';
                return;
            }

            list.innerHTML = allHistory.map(tr => `
                <div onclick="selectTrace('${tr.trace_id}')" class="trace-item p-4 border-b border-white/5 cursor-pointer transition-all ${tr.trace_id === currentTraceId ? 'trace-active' : ''}">
                    <div class="flex justify-between items-start mb-1">
                         <span class="text-[10px] mono text-emerald-400 font-bold uppercase">${tr.trace_id}</span>
                         <span class="text-[10px] text-slate-500">${new Date(tr.events[0].timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="text-sm font-semibold truncate text-slate-200">"${tr.question}"</div>
                    <div class="flex items-center gap-3 mt-2">
                        <span class="text-[10px] text-slate-400">${tr.summary.total_ms}ms</span>
                        <span class="text-[10px] text-slate-400">${tr.summary.steps} stages</span>
                        <span class="text-[10px] ${tr.summary.status === 'COMPLETED' ? 'text-emerald-500' : 'text-rose-500'} font-bold">${tr.summary.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function updateHealth(h) {
            document.getElementById('sysStatus').innerText = h.status;
            document.getElementById('p50Latency').innerText = h.metrics.p50_latency_ms + 'ms';
            const rate = h.metrics.total_queries ? ((1 - (h.metrics.failed_queries / h.metrics.total_queries)) * 100).toFixed(0) : 100;
            document.getElementById('successRate').innerText = rate + '%';
        }

        function selectTrace(tid) {
            currentTraceId = tid;
            renderHistory();
            const trace = allHistory.find(t => t.trace_id === tid);
            if (!trace) return;

            const area = document.getElementById('flowArea');
            area.innerHTML = `
                <div class="mb-8 p-6 bg-emerald-500/5 border border-emerald-500/20 rounded-xl">
                    <h2 class="text-2xl font-bold text-white mb-2">"${trace.question}"</h2>
                    <div class="flex gap-4 text-xs font-semibold text-slate-400">
                        <span>START: ${new Date(trace.events[0].timestamp).toISOString()}</span>
                        <span>END: ${new Date(trace.events[trace.events.length-1].timestamp).toISOString()}</span>
                        <span>TRACE_ID: <span class="mono text-emerald-400">${tid}</span></span>
                    </div>
                </div>
                
                <div class="space-y-4 relative">
                    <div class="absolute left-4 top-0 bottom-0 w-px bg-white/10 ml-0.5"></div>
                    ${trace.events.map(ev => `
                        <div class="relative pl-12 group">
                            <div class="absolute left-[14px] top-1.5 w-3 h-3 rounded-full border-2 border-slate-700 bg-emerald-500 z-10"></div>
                            <div class="p-4 bg-white/5 border border-white/5 rounded-lg group-hover:bg-white/10 transition-all">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">${ev.stage}</span>
                                    <span class="text-[10px] mono text-slate-500">${ev.elapsed_ms}ms</span>
                                </div>
                                <div class="text-sm text-slate-300">
                                    ${renderEventData(ev.data, ev.agent_name)}
                                </div>
                                ${ev.agent_name ? `<div class="mt-2 text-[10px] text-slate-500 font-bold uppercase">Agent: ${ev.agent_name}</div>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderEventData(data, agent) {
            if (typeof data === 'string') return data;
            if (data.message) return `<div class="italic text-slate-400">${data.message}</div>`;
            if (data.sub_questions) return `<div class="space-y-1">${data.sub_questions.map(q => `• ${q}`).join('<br>')}</div>`;
            if (data.brief) return `<div class="text-xs leading-relaxed max-h-24 overflow-y-auto">${data.brief}</div>`;
            if (data.gaps) return `<div class="text-rose-400 font-semibold">Gaps: ${data.gaps.join(', ')}</div>`;
            return `<pre class="text-[10px] text-slate-500 overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>`;
        }

        // Init
        refreshData();
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
